# Az adatbázis-migrációk automatikus alkalmazása az éles Supabase-projekten.
#
# Mikor fut: ha a main ágra új vagy módosított fájl kerül a supabase/migrations/ mappába,
# vagy kézzel (Actions → „Supabase migrációk” → Run workflow). Pull requestre soha
# (idegen forkból sem): a titkok csak a main ágon futó munkafolyamatnak érhetők el.
#
# Titkok (Settings → Secrets and variables → Actions → New repository secret):
#   SUPABASE_ACCESS_TOKEN  – Supabase dashboard → Account → Access Tokens
#   SUPABASE_DB_PASSWORD   – az adatbázis jelszava
# Egyik sem kerül a repóba vagy a naplóba.
#
# A CLI a supabase_migrations.schema_migrations táblában tartja nyilván, mit alkalmazott
# már, és csak az újakat futtatja. A kézzel (SQL Editorban) lefuttatott migrációkat egyszer
# meg kell jelölni: kézi indítás, a „repair” mezőbe a verziók szóközzel elválasztva.

name: Supabase migrációk

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:
    inputs:
      repair:
        description: 'Egyszeri: kézzel már lefuttatott migrációk megjelölése alkalmazottként (verziók szóközzel, pl. 20261114120000 20261114150000). Üresen: csak az új migrációk futnak.'
        required: false
        default: ''
      dry_run:
        description: 'Csak kiírja, mit futtatna (nem módosít semmit)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: eokwxkrcttsoxfflvuus
      REPAIR: ${{ inputs.repair }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - name: Titkok ellenőrzése
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Hiányzik a SUPABASE_ACCESS_TOKEN vagy a SUPABASE_DB_PASSWORD titok (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Kapcsolódás a projekthez
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Egyszeri javítás (kézzel lefuttatott migrációk)
        if: env.REPAIR != ''
        run: |
          # Csak számjegyek és szóköz lehet benne (a bemenet nem kerülhet parancsként a shellbe).
          if ! printf '%s' "$REPAIR" | grep -Eq '^[0-9]{14}( [0-9]{14})*$'; then
            echo "::error::A repair mezőben csak 14 jegyű verziók lehetnek, szóközzel elválasztva."
            exit 1
          fi
          for v in $REPAIR; do
            ls supabase/migrations/"$v"_*.sql >/dev/null || { echo "::error::Nincs ilyen migráció: $v"; exit 1; }
          done
          supabase migration repair --linked --status applied $REPAIR --password "$SUPABASE_DB_PASSWORD"

      - name: Állapot előtte
        run: supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Az új migrációk alkalmazása
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            supabase db push --linked --dry-run --password "$SUPABASE_DB_PASSWORD"
          else
            supabase db push --linked --password "$SUPABASE_DB_PASSWORD"
          fi

      - name: Állapot utána
        run: supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"
