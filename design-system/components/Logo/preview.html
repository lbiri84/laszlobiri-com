.name span{color:var(--accent)}
.cap{margin-top:var(--space-2);font-size:14px;color:var(--fg-muted)}
.small{display:flex;gap:var(--space-8);align-items:flex-end;margin-top:var(--space-6)}
.small .mk{height:auto;display:block}
.mk .ln{stroke:var(--mark-l)}.mk .dt{fill:var(--mark-l)}.mk .st{fill:var(--mark-b)}.mk .en{stroke:var(--mark-ring)}.mk .ms{stroke:var(--mark-l);stroke-opacity:.09}
