<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&amp;display=swap">
<style>
html,body{margin:0}
.c{position:relative;width:960px;height:288px;overflow:hidden;background:var(--bg);font-family:var(--font-sans)}
.name{position:absolute;left:32px;bottom:60px;width:440px;font-size:72px;line-height:.95;font-weight:600;letter-spacing:-.03em;color:var(--fg);margin:0}
.tag{position:absolute;left:32px;bottom:24px;width:440px;font-size:14px;line-height:20px;color:var(--fg-muted);margin:0}
svg{position:absolute;left:0;top:0}
.blk{fill:var(--brand-black);rx:var(--radius-md)}
.org{fill:var(--brand-orange);rx:var(--radius-md)}
.mut{fill:var(--fg-muted);rx:var(--radius-md)}
.m{fill:var(--brand-mist)}
.o{fill:var(--brand-orange)}
</style></head><body>
<div class="c">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">

<rect class="blk" x="480" y="120" width="208" height="152"/>
<rect class="org" x="704" y="24" width="140" height="224"/>
<rect class="mut" x="860" y="48" width="140" height="96"/>

</svg>
<h1 class="name">laszlobiri</h1>
<p class="tag">személyes oldal, pontokból építve</p>
</div></body></html>
